name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  git-integrity:
    name: Event Diff and Working Tree
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check event diff and working tree
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            head_sha="$PR_HEAD_SHA"
            base_sha="$(git merge-base "$PR_BASE_SHA" "$head_sha")"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            head_sha="$PUSH_AFTER_SHA"
            if [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
              base_sha="$(git hash-object -t tree --stdin </dev/null)"
            else
              base_sha="$PUSH_BEFORE_SHA"
            fi
          else
            head_sha="$WORKFLOW_SHA"
            if git rev-parse --verify "${head_sha}^1" >/dev/null 2>&1; then
              base_sha="$(git rev-parse --verify "${head_sha}^1")"
            else
              base_sha="$(git hash-object -t tree --stdin </dev/null)"
            fi
          fi

          git diff --check "$base_sha" "$head_sha"
          git diff --exit-code
          git diff --cached --exit-code

  composer-check:
    name: Composer Check (PHP ${{ matrix.php }})
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Composer check suite
        run: composer check

      - name: Verify clean working tree
        run: git diff --exit-code

  autoload:
    name: Strict Composer Autoload
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.1-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.1-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify Composer autoloading
        run: composer dump-autoload --optimize --strict-psr --strict-ambiguous

      - name: Verify clean working tree
        run: git diff --exit-code

  prefer-lowest:
    name: Prefer Lowest (PHP 8.1)
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none

      - name: Cache lowest Composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.1-composer-lowest-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-8.1-composer-lowest-

      - name: Install lowest dependencies
        run: composer update --prefer-lowest --prefer-dist --no-interaction --no-progress

      - name: Run Composer check suite
        run: composer check

  windows-smoke:
    name: Windows Smoke (PHP 8.1)
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.1-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.1-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit
        run: composer test

      - name: Check benchmark bootstrap
        run: composer bench:check
