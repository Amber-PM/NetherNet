name: Native WebRTC

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  native:
    name: Pinned native backend (PHP 8.5 NTS)
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake git pkg-config libssl-dev autoconf automake libtool
          command -v phpize
          command -v php-config

      - name: Build and test pinned native dependencies
        run: bash scripts/build-webrtc.sh "$RUNNER_TEMP/nethernet-native"

      - name: Enable native extension for CLI subprocesses
        run: echo "PHP_INI_SCAN_DIR=$PHP_INI_SCAN_DIR:$RUNNER_TEMP/nethernet-native/ini" >> "$GITHUB_ENV"

      - name: Prove extension loads and inspect runtime API
        run: |
          php --ri webrtc
          php --re webrtc
          php scripts/reflect-webrtc.php > "$RUNNER_TEMP/webrtc.stub"
          diff -u stubs/webrtc.stub "$RUNNER_TEMP/webrtc.stub"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Install and validate library
        # legacy ext-webrtc backend; ext-rtc is the required backend and must not load here
        run: |
          composer install --ignore-platform-req=ext-rtc --prefer-dist --no-interaction --no-progress
          composer validate --strict
          composer test
          composer analyse
          composer bench:check
          composer dump-autoload --optimize --strict-psr --strict-ambiguous

      - name: Run real peer integration tests
        run: composer test:native

      - name: Verify clean working tree
        run: git diff --exit-code
